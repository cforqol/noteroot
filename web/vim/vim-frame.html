<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vim Editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'JetBrains Mono', 'Menlo', 'Monaco', monospace;
      overflow: hidden;
    }
    #terminal {
      width: 100%;
      height: 100vh;
      padding: 8px;
    }
    #status {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 10px;
      color: #888;
      background: rgba(0,0,0,0.5);
      padding: 2px 6px;
      border-radius: 3px;
      pointer-events: none;
    }
    .error-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: #b45309;
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      text-align: center;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="status">Loading...</div>
  <div id="terminal"></div>
  <script type="module" src="/vim/vim-bridge.js"></script>
</body>
</html>
