name: CI

on:
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --experimental-vm-modules node_modules/.bin/jest --config jest.config.js --runInBand

  dockerfile:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [go, web, dockerfile]
    if: ${{ !github.event.deleted }}
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: noteroot:ci
    steps:
      - uses: actions/checkout@v4

      - name: Stale run guard
        if: github.ref_type == 'branch'
        run: test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"

      - uses: docker/setup-buildx-action@v3

      - name: Image names
        run: echo "IMAGES=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha

      - name: Version
        run: echo "BUILD_VERSION=${{ steps.meta.outputs.version }}" >> "$GITHUB_ENV"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.LOCAL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eu
          trap 'docker rm -f auth app >/dev/null 2>&1 || true' EXIT

          for v in PUID PGID NOTEROOT_DATA_DIR NOTEROOT_LISTEN NOTEROOT_AUTH_MODE \
                   NOTEROOT_LOG_LEVEL NOTEROOT_GC_INTERVAL NOTEROOT_QUOTA_BYTES \
                   NOTEROOT_S3_BUCKET NOTEROOT_S3_SECRET_KEY NOTEROOT_READ_TIMEOUT; do
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$LOCAL_IMAGE" | grep -q -- "^${v}="
          done

          docker run -d --name auth -p 127.0.0.1:18081:8080 "$LOCAL_IMAGE"
          timeout 30s sh -c 'until curl -fsS -o /dev/null http://127.0.0.1:18081/healthz; do sleep 1; done'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/api/v1/notebooks)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/n/any/tree)" = 401

          docker run -d --name app -e NOTEROOT_AUTH_MODE=none -p 127.0.0.1:18080:8080 "$LOCAL_IMAGE"
          timeout 30s sh -c 'until curl -fsS -o /dev/null http://127.0.0.1:18080/healthz; do sleep 1; done'
          curl -fsS http://127.0.0.1:18080/api/v1/notebooks > /dev/null
          curl -fsS http://127.0.0.1:18080/ | grep -qi noteroot

          hc=$(docker inspect -f '{{index .Config.Healthcheck.Test 1}}' "$LOCAL_IMAGE")
          docker exec auth sh -c "$hc"

          docker run --rm "$LOCAL_IMAGE" --version | grep -F -- "$BUILD_VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker tag "$LOCAL_IMAGE" "$t"
            docker push "$t"
          done <<< "$TAGS"
